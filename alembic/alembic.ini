# Alembic migration configuration for DRA.
#
# The target database is resolved from the shared DATABASE_URL environment
# variable (same one src/dra/db.py uses), so `alembic upgrade head` and the
# app's runtime engine point at the same Postgres+pgvector instance.

[alembic]
script_location = alembic
sqlalchemy.url = %(here)s

# Inherit the live connection URL from the environment. Alembic's env.py
# resolves DATABASE_URL (with the same default the app uses); this ini value
# is only consulted for `alembic init`-style commands, not by env.py.
envlog = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
