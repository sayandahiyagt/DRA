[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dra"
version = "0.1.0"
description = "Deep research agent: bootstrap scaffold (LangGraph + Postgres/pgvector + Docling/GROBID + MCP)."
requires-python = ">=3.12"
dependencies = [
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "sqlalchemy==2.0.41",
  "psycopg[binary]==3.3.5",
  "pgvector==0.5.0",
  "docling==2.124.0",
  "grobid-client-python==0.2.0",
  "mcp==2.1.1",
  "alembic==1.19.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]
# dra#26 investigate extra: real web-acquisition SDKs, env-gated behind
# ProviderMode.LIVE (credential-gated, skipped without API keys — see
# dra.routing.providers._creds_reachable and dra.investigators.providers_live).
#
# Package names are pinned to the *verified* PyPI names (the original spec
# listed `exa` — which is a different PyPI project — and `perplexity-sdk`,
# which does not exist on PyPI; Perplexity has no official SDK).
investigate = [
  "exa-py>=1.0",              # Exa AI search/extraction — imports as `exa`
  "tavily>=1.0",              # Tavily map/crawl/extract
  "firecrawl>=2.0",            # Firecrawl scrape/crawl/map/extract
  "playwright>=1.49",          # rendered browser capture (§11.4 steps 4-8)
]
# NOTE: ``playwright install chromium`` is an operator-run step — browser
# binaries are deliberately NOT a canonical dependency (§17.3 non-goal, D3).
# Perplexity Search is listed in the §17.2 provider matrix but has no official
# PyPI package; see providers_live.PerplexitySearchClient (lazy import).


[project.scripts]
dra-db-check = "dra.db:main"
dra-storage-proof = "dra.proof_corpus:main"
dra-model-routing-proof = "dra.routing.proof:main"
dra-verification-gate = "dra.verification_gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.alembic]
script_location = "alembic"
